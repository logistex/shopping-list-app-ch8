<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>쇼핑 리스트</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #8a94a0;
      --border: #e3e7eb;
      --accent: #2f9e6e;
      --accent-hover: #26845b;
      --danger: #d64545;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171a;
        --card: #1e2226;
        --text: #e6e9ec;
        --muted: #7d8791;
        --border: #2e343a;
        --accent: #3bb37f;
        --accent-hover: #4cc78f;
        --danger: #ef6b6b;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }

    .app {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      align-self: flex-start;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 1.5rem;
    }

    .summary {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    form {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--text);
    }
    input[type="text"]:focus {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .add-btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    .add-btn:hover { background: var(--accent-hover); }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 4px;
      border-bottom: 1px solid var(--border);
    }
    li:last-child { border-bottom: none; }

    li input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }

    li label {
      flex: 1;
      word-break: break-word;
      cursor: pointer;
    }

    li.done label {
      text-decoration: line-through;
      color: var(--muted);
    }

    .delete-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 1.2rem;
      line-height: 1;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .delete-btn:hover {
      color: var(--danger);
      background: rgba(214, 69, 69, 0.1);
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 24px 0;
    }

    .footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
    }

    .clear-btn {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .clear-btn:hover { color: var(--danger); border-color: var(--danger); }
    .clear-btn[hidden] { display: none; }
  </style>
</head>
<body>
  <main class="app">
    <h1>🛒 쇼핑 리스트</h1>
    <p class="summary" id="summary"></p>

    <form id="add-form">
      <input type="text" id="item-input" placeholder="살 물건을 입력하세요" autocomplete="off" autofocus />
      <button type="submit" class="add-btn">추가</button>
    </form>

    <ul id="list"></ul>
    <p class="empty" id="empty">아직 아이템이 없어요.</p>

    <div class="footer">
      <button type="button" class="clear-btn" id="clear-done" hidden>완료 항목 지우기</button>
    </div>
  </main>

  <script>
    const STORAGE_KEY = "shopping-list-items";

    const form = document.getElementById("add-form");
    const input = document.getElementById("item-input");
    const list = document.getElementById("list");
    const empty = document.getElementById("empty");
    const summary = document.getElementById("summary");
    const clearDoneBtn = document.getElementById("clear-done");

    let items = load();

    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch {
        return [];
      }
    }

    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      } catch {
        // 저장소를 쓸 수 없는 환경이면 메모리에만 유지
      }
    }

    function render() {
      list.innerHTML = "";

      for (const item of items) {
        const li = document.createElement("li");
        if (item.done) li.classList.add("done");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.id = "item-" + item.id;
        checkbox.checked = item.done;
        checkbox.addEventListener("change", () => toggleItem(item.id));

        const label = document.createElement("label");
        label.htmlFor = checkbox.id;
        label.textContent = item.text;

        const delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.className = "delete-btn";
        delBtn.textContent = "×";
        delBtn.title = "삭제";
        delBtn.setAttribute("aria-label", `${item.text} 삭제`);
        delBtn.addEventListener("click", () => deleteItem(item.id));

        li.append(checkbox, label, delBtn);
        list.appendChild(li);
      }

      const total = items.length;
      const doneCount = items.filter((i) => i.done).length;
      empty.hidden = total > 0;
      summary.textContent = total
        ? `전체 ${total}개 · 완료 ${doneCount}개 · 남은 ${total - doneCount}개`
        : "필요한 물건을 추가해 보세요.";
      clearDoneBtn.hidden = doneCount === 0;
    }

    function addItem(text) {
      items.push({ id: Date.now() + Math.random().toString(36).slice(2), text, done: false });
      save();
      render();
    }

    function toggleItem(id) {
      const item = items.find((i) => i.id === id);
      if (item) item.done = !item.done;
      save();
      render();
    }

    function deleteItem(id) {
      items = items.filter((i) => i.id !== id);
      save();
      render();
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      addItem(text);
      input.value = "";
      input.focus();
    });

    clearDoneBtn.addEventListener("click", () => {
      items = items.filter((i) => !i.done);
      save();
      render();
    });

    render();
  </script>
</body>
</html>
