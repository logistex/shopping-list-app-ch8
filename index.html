<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>쇼핑 리스트</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #8a94a0;
      --border: #e3e7eb;
      --accent: #2f9e6e;
      --accent-hover: #26845b;
      --danger: #d64545;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171a;
        --card: #1e2226;
        --text: #e6e9ec;
        --muted: #7d8791;
        --border: #2e343a;
        --accent: #3bb37f;
        --accent-hover: #4cc78f;
        --danger: #ef6b6b;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }

    .app {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      align-self: flex-start;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 1.5rem;
    }

    .summary {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    form {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--text);
    }
    input[type="text"]:focus {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .add-btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    .add-btn:hover { background: var(--accent-hover); }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 4px;
      border-bottom: 1px solid var(--border);
    }
    li:last-child { border-bottom: none; }

    li input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }

    li label {
      flex: 1;
      word-break: break-word;
      cursor: pointer;
    }

    li.done label {
      text-decoration: line-through;
      color: var(--muted);
    }

    .delete-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 1.2rem;
      line-height: 1;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .delete-btn:hover {
      color: var(--danger);
      background: rgba(214, 69, 69, 0.1);
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 24px 0;
    }

    .status {
      margin: 0 0 12px;
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(214, 69, 69, 0.1);
      color: var(--danger);
      font-size: 0.9rem;
    }
    .status[hidden] { display: none; }

    .footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
    }

    .clear-btn {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .clear-btn:hover { color: var(--danger); border-color: var(--danger); }
    .clear-btn[hidden] { display: none; }
  </style>
</head>
<body>
  <main class="app">
    <h1>🛒 쇼핑 리스트</h1>
    <p class="summary" id="summary"></p>

    <form id="add-form">
      <input type="text" id="item-input" placeholder="살 물건을 입력하세요" maxlength="200" autocomplete="off" autofocus />
      <button type="submit" class="add-btn">추가</button>
    </form>

    <p class="status" id="status" role="alert" hidden></p>

    <ul id="list"></ul>
    <p class="empty" id="empty">아직 아이템이 없어요.</p>

    <div class="footer">
      <button type="button" class="clear-btn" id="clear-done" hidden>완료 항목 지우기</button>
    </div>
  </main>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/+esm";

    // 공개(publishable) 키는 브라우저에 노출되어도 되는 키이며, 접근 권한은 RLS 정책이 결정한다.
    const SUPABASE_URL = "https://rkkebybdtoqfbplshrvq.supabase.co";
    const SUPABASE_KEY = "sb_publishable_MtwMHuEA_z3xKmi_Fx1bIw_gjOmrXTC";
    const TABLE = "shop_items";
    const LEGACY_STORAGE_KEY = "shopping-list-items"; // 예전 로컬 스토리지 키 (한 번만 옮긴다)

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById("add-form");
    const input = document.getElementById("item-input");
    const list = document.getElementById("list");
    const empty = document.getElementById("empty");
    const summary = document.getElementById("summary");
    const status = document.getElementById("status");
    const clearDoneBtn = document.getElementById("clear-done");

    let items = [];
    let loaded = false;
    let channel = null; // 실시간 구독 채널
    let listRun = 0; // 시작/정지할 때마다 늘려서, 늦게 도착한 이전 응답을 버린다

    function showError(message, error) {
      console.error(message, error);
      status.textContent = message;
      status.hidden = false;
    }

    function clearError() {
      status.hidden = true;
      status.textContent = "";
    }

    function sortItems() {
      items.sort((a, b) => a.created_at.localeCompare(b.created_at));
    }

    // 같은 id가 있으면 바꾸고, 없으면 추가한다 (실시간 이벤트가 중복으로 와도 안전)
    function upsertLocal(row) {
      const index = items.findIndex((i) => i.id === row.id);
      if (index === -1) items.push(row);
      else items[index] = row;
      sortItems();
    }

    function removeLocal(ids) {
      const set = new Set(ids);
      items = items.filter((i) => !set.has(i.id));
    }

    function render() {
      list.innerHTML = "";

      for (const item of items) {
        const li = document.createElement("li");
        if (item.done) li.classList.add("done");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.id = "item-" + item.id;
        checkbox.checked = item.done;
        checkbox.addEventListener("change", () => toggleItem(item.id));

        const label = document.createElement("label");
        label.htmlFor = checkbox.id;
        label.textContent = item.text;

        const delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.className = "delete-btn";
        delBtn.textContent = "×";
        delBtn.title = "삭제";
        delBtn.setAttribute("aria-label", `${item.text} 삭제`);
        delBtn.addEventListener("click", () => deleteItem(item.id));

        li.append(checkbox, label, delBtn);
        list.appendChild(li);
      }

      const total = items.length;
      const doneCount = items.filter((i) => i.done).length;
      empty.hidden = !loaded || total > 0;
      if (!loaded) summary.textContent = "불러오는 중…";
      else
        summary.textContent = total
          ? `전체 ${total}개 · 완료 ${doneCount}개 · 남은 ${total - doneCount}개`
          : "필요한 물건을 추가해 보세요.";
      clearDoneBtn.hidden = doneCount === 0;
    }

    async function loadItems() {
      const run = listRun;
      const { data, error } = await supabase
        .from(TABLE)
        .select("id, text, done, created_at")
        .order("created_at", { ascending: true });
      if (run !== listRun) return; // 그사이 정지했으면 버린다
      if (error) return showError("목록을 불러오지 못했어요.", error);
      items = data;
      loaded = true;
      clearError();
      render();
    }

    // 예전에 로컬 스토리지에만 저장했던 항목이 있으면 데이터베이스로 한 번 옮긴다
    async function migrateLegacyItems() {
      let legacy;
      try {
        legacy = JSON.parse(localStorage.getItem(LEGACY_STORAGE_KEY) || "[]");
      } catch {
        return;
      }
      if (!Array.isArray(legacy) || legacy.length === 0) return;

      const rows = legacy
        .filter((i) => typeof i?.text === "string" && i.text.trim())
        .map((i) => ({ text: i.text.trim().slice(0, 200), done: Boolean(i.done) }));
      if (rows.length) {
        const { error } = await supabase.from(TABLE).insert(rows);
        if (error) return showError("예전 항목을 옮기지 못했어요.", error);
      }
      try {
        localStorage.removeItem(LEGACY_STORAGE_KEY);
      } catch {
        // 지울 수 없어도 동작에는 문제없음
      }
    }

    async function addItem(text) {
      const { data, error } = await supabase
        .from(TABLE)
        .insert({ text })
        .select("id, text, done, created_at")
        .single();
      if (error) return showError("항목을 추가하지 못했어요.", error);
      clearError();
      upsertLocal(data);
      render();
    }

    async function toggleItem(id) {
      const item = items.find((i) => i.id === id);
      if (!item) return;
      const done = !item.done;

      item.done = done; // 화면에 먼저 반영
      render();

      const { error } = await supabase.from(TABLE).update({ done }).eq("id", id);
      if (error) {
        item.done = !done; // 실패하면 되돌린다
        render();
        return showError("상태를 바꾸지 못했어요.", error);
      }
      clearError();
    }

    async function deleteItem(id) {
      const { error } = await supabase.from(TABLE).delete().eq("id", id);
      if (error) return showError("항목을 삭제하지 못했어요.", error);
      clearError();
      removeLocal([id]);
      render();
    }

    async function clearDone() {
      const ids = items.filter((i) => i.done).map((i) => i.id);
      if (ids.length === 0) return;
      const { error } = await supabase.from(TABLE).delete().in("id", ids);
      if (error) return showError("완료 항목을 지우지 못했어요.", error);
      clearError();
      removeLocal(ids);
      render();
    }

    // 다른 창이나 기기에서 바뀐 내용을 실시간으로 받는다
    function subscribeChanges() {
      channel = supabase
        .channel("shop-items-changes")
        .on("postgres_changes", { event: "*", schema: "public", table: TABLE }, (payload) => {
          if (payload.eventType === "DELETE") removeLocal([payload.old.id]);
          else upsertLocal(payload.new);
          render();
        })
        .subscribe((state) => {
          // 처음 연결되거나 끊겼다가 다시 연결되면 놓친 변경이 없도록 전체를 다시 읽는다
          if (state === "SUBSCRIBED") loadItems();
          else if (state === "CHANNEL_ERROR" || state === "TIMED_OUT")
            showError("실시간 연결이 끊겼어요. 다시 연결하는 중…");
        });
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      input.focus();
      await addItem(text);
    });

    clearDoneBtn.addEventListener("click", clearDone);

    // 목록을 불러오고 실시간 구독을 시작한다
    async function startList() {
      const run = ++listRun;
      items = [];
      loaded = false;
      render();
      await migrateLegacyItems();
      if (run !== listRun) return;
      await loadItems();
      if (run !== listRun) return;
      subscribeChanges();
    }

    // 구독을 끊고 화면의 목록을 비운다
    function stopList() {
      listRun++;
      if (channel) {
        supabase.removeChannel(channel);
        channel = null;
      }
      items = [];
      loaded = false;
      render();
    }

    startList();
  </script>
</body>
</html>
