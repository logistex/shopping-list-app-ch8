<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>쇼핑 리스트</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #8a94a0;
      --border: #e3e7eb;
      --accent: #2f9e6e;
      --accent-hover: #26845b;
      --danger: #d64545;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171a;
        --card: #1e2226;
        --text: #e6e9ec;
        --muted: #7d8791;
        --border: #2e343a;
        --accent: #3bb37f;
        --accent-hover: #4cc78f;
        --danger: #ef6b6b;
      }
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }

    .app {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      align-self: flex-start;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px 12px;
      margin-bottom: 4px;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    .user-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      font-size: 0.9rem;
    }

    .user-name {
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .logout-btn {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      flex-shrink: 0;
    }
    .logout-btn:hover { color: var(--text); border-color: var(--muted); }

    .login-view {
      text-align: center;
      padding: 24px 0 8px;
    }

    .login-view p {
      margin: 0 0 16px;
      color: var(--muted);
    }

    .github-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: #24292f;
      color: #fff;
      font-weight: 600;
    }
    .github-btn:hover { background: #32383f; }
    .github-btn:disabled { opacity: 0.6; cursor: default; }
    .github-btn svg { width: 20px; height: 20px; fill: currentColor; }
    @media (prefers-color-scheme: dark) {
      .github-btn { background: #f0f3f6; color: #1f2328; }
      .github-btn:hover { background: #d8dee4; }
    }

    .summary {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    form {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--text);
    }
    input[type="text"]:focus {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .add-btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    .add-btn:hover { background: var(--accent-hover); }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 4px;
      border-bottom: 1px solid var(--border);
    }
    li:last-child { border-bottom: none; }

    li input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }

    li label {
      flex: 1;
      word-break: break-word;
      cursor: pointer;
    }

    li.done label {
      text-decoration: line-through;
      color: var(--muted);
    }

    .delete-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 1.2rem;
      line-height: 1;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .delete-btn:hover {
      color: var(--danger);
      background: rgba(214, 69, 69, 0.1);
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 24px 0;
    }

    .status {
      margin: 0 0 12px;
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(214, 69, 69, 0.1);
      color: var(--danger);
      font-size: 0.9rem;
    }
    .status[hidden] { display: none; }

    .footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
    }

    .clear-btn {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .clear-btn:hover { color: var(--danger); border-color: var(--danger); }
    .clear-btn[hidden] { display: none; }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <h1>🛒 쇼핑 리스트</h1>
      <div class="user-bar" id="user-bar" hidden>
        <span class="user-name" id="user-name"></span>
        <button type="button" class="logout-btn" id="logout-btn">로그아웃</button>
      </div>
    </div>

    <p class="status" id="status" role="alert" hidden></p>

    <!-- 로그인하지 않았을 때: 로그인 단추만 보인다 -->
    <section class="login-view" id="login-view" hidden>
      <p>목록을 보려면 로그인하세요.</p>
      <button type="button" class="github-btn" id="login-btn">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        깃허브로 로그인
      </button>
    </section>

    <!-- 로그인했을 때: 쇼핑 리스트 -->
    <section id="list-view" hidden>
      <p class="summary" id="summary"></p>

      <form id="add-form">
        <input type="text" id="item-input" placeholder="살 물건을 입력하세요" maxlength="200" autocomplete="off" />
        <button type="submit" class="add-btn">추가</button>
      </form>

      <ul id="list"></ul>
      <p class="empty" id="empty">아직 아이템이 없어요.</p>

      <div class="footer">
        <button type="button" class="clear-btn" id="clear-done" hidden>완료 항목 지우기</button>
      </div>
    </section>
  </main>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/+esm";

    // 공개(publishable) 키는 브라우저에 노출되어도 되는 키이며, 접근 권한은 RLS 정책이 결정한다.
    const SUPABASE_URL = "https://rkkebybdtoqfbplshrvq.supabase.co";
    const SUPABASE_KEY = "sb_publishable_MtwMHuEA_z3xKmi_Fx1bIw_gjOmrXTC";
    const TABLE = "shop_items";
    const LEGACY_STORAGE_KEY = "shopping-list-items"; // 예전 로컬 스토리지 키 (한 번만 옮긴다)
    const REDIRECT_URL = "https://shopping-list-app-ch8.vercel.app"; // 깃허브 로그인 뒤 돌아올 주소

    // 깃허브에서 돌아온 주소에 오류가 실려 있으면 기억해 둔다 (Supabase가 주소를 정리하기 전에 읽는다)
    const params = new URLSearchParams(location.search + "&" + location.hash.slice(1));
    const oauthError = params.get("error_description") || params.get("error");

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { flowType: "pkce" },
    });

    const loginView = document.getElementById("login-view");
    const listView = document.getElementById("list-view");
    const userBar = document.getElementById("user-bar");
    const userName = document.getElementById("user-name");
    const loginBtn = document.getElementById("login-btn");
    const logoutBtn = document.getElementById("logout-btn");
    const form = document.getElementById("add-form");
    const input = document.getElementById("item-input");
    const list = document.getElementById("list");
    const empty = document.getElementById("empty");
    const summary = document.getElementById("summary");
    const status = document.getElementById("status");
    const clearDoneBtn = document.getElementById("clear-done");

    let items = [];
    let loaded = false;
    let channel = null; // 실시간 구독 채널
    let currentUserId = null; // 지금 로그인한 사용자 (없으면 null)
    let listRun = 0; // 로그인/로그아웃마다 늘려서, 늦게 도착한 이전 응답을 버린다

    function showError(message, error) {
      console.error(message, error);
      status.textContent = message;
      status.hidden = false;
    }

    function clearError() {
      status.hidden = true;
      status.textContent = "";
    }

    function sortItems() {
      items.sort((a, b) => a.created_at.localeCompare(b.created_at));
    }

    // 같은 id가 있으면 바꾸고, 없으면 추가한다 (실시간 이벤트가 중복으로 와도 안전)
    function upsertLocal(row) {
      const index = items.findIndex((i) => i.id === row.id);
      if (index === -1) items.push(row);
      else items[index] = row;
      sortItems();
    }

    function removeLocal(ids) {
      const set = new Set(ids);
      items = items.filter((i) => !set.has(i.id));
    }

    function render() {
      list.innerHTML = "";

      for (const item of items) {
        const li = document.createElement("li");
        if (item.done) li.classList.add("done");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.id = "item-" + item.id;
        checkbox.checked = item.done;
        checkbox.addEventListener("change", () => toggleItem(item.id));

        const label = document.createElement("label");
        label.htmlFor = checkbox.id;
        label.textContent = item.text;

        const delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.className = "delete-btn";
        delBtn.textContent = "×";
        delBtn.title = "삭제";
        delBtn.setAttribute("aria-label", `${item.text} 삭제`);
        delBtn.addEventListener("click", () => deleteItem(item.id));

        li.append(checkbox, label, delBtn);
        list.appendChild(li);
      }

      const total = items.length;
      const doneCount = items.filter((i) => i.done).length;
      empty.hidden = !loaded || total > 0;
      if (!loaded) summary.textContent = "불러오는 중…";
      else
        summary.textContent = total
          ? `전체 ${total}개 · 완료 ${doneCount}개 · 남은 ${total - doneCount}개`
          : "필요한 물건을 추가해 보세요.";
      clearDoneBtn.hidden = doneCount === 0;
    }

    async function loadItems() {
      const run = listRun;
      const { data, error } = await supabase
        .from(TABLE)
        .select("id, text, done, created_at")
        .order("created_at", { ascending: true });
      if (run !== listRun) return; // 그사이 로그아웃했으면 버린다
      if (error) return showError("목록을 불러오지 못했어요.", error);
      items = data;
      loaded = true;
      clearError();
      render();
    }

    // 예전에 로컬 스토리지에만 저장했던 항목이 있으면 데이터베이스로 한 번 옮긴다
    async function migrateLegacyItems() {
      let legacy;
      try {
        legacy = JSON.parse(localStorage.getItem(LEGACY_STORAGE_KEY) || "[]");
      } catch {
        return;
      }
      if (!Array.isArray(legacy) || legacy.length === 0) return;

      const rows = legacy
        .filter((i) => typeof i?.text === "string" && i.text.trim())
        .map((i) => ({ text: i.text.trim().slice(0, 200), done: Boolean(i.done) }));
      if (rows.length) {
        const { error } = await supabase.from(TABLE).insert(rows);
        if (error) return showError("예전 항목을 옮기지 못했어요.", error);
      }
      try {
        localStorage.removeItem(LEGACY_STORAGE_KEY);
      } catch {
        // 지울 수 없어도 동작에는 문제없음
      }
    }

    async function addItem(text) {
      const { data, error } = await supabase
        .from(TABLE)
        .insert({ text })
        .select("id, text, done, created_at")
        .single();
      if (error) return showError("항목을 추가하지 못했어요.", error);
      clearError();
      upsertLocal(data);
      render();
    }

    async function toggleItem(id) {
      const item = items.find((i) => i.id === id);
      if (!item) return;
      const done = !item.done;

      item.done = done; // 화면에 먼저 반영
      render();

      const { error } = await supabase.from(TABLE).update({ done }).eq("id", id);
      if (error) {
        item.done = !done; // 실패하면 되돌린다
        render();
        return showError("상태를 바꾸지 못했어요.", error);
      }
      clearError();
    }

    async function deleteItem(id) {
      const { error } = await supabase.from(TABLE).delete().eq("id", id);
      if (error) return showError("항목을 삭제하지 못했어요.", error);
      clearError();
      removeLocal([id]);
      render();
    }

    async function clearDone() {
      const ids = items.filter((i) => i.done).map((i) => i.id);
      if (ids.length === 0) return;
      const { error } = await supabase.from(TABLE).delete().in("id", ids);
      if (error) return showError("완료 항목을 지우지 못했어요.", error);
      clearError();
      removeLocal(ids);
      render();
    }

    // 다른 창이나 기기에서 바뀐 내용을 실시간으로 받는다
    function subscribeChanges() {
      channel = supabase
        .channel("shop-items-changes")
        .on("postgres_changes", { event: "*", schema: "public", table: TABLE }, (payload) => {
          if (payload.eventType === "DELETE") removeLocal([payload.old.id]);
          else upsertLocal(payload.new);
          render();
        })
        .subscribe((state) => {
          // 처음 연결되거나 끊겼다가 다시 연결되면 놓친 변경이 없도록 전체를 다시 읽는다
          if (state === "SUBSCRIBED") loadItems();
          else if (state === "CHANNEL_ERROR" || state === "TIMED_OUT")
            showError("실시간 연결이 끊겼어요. 다시 연결하는 중…");
        });
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      input.focus();
      await addItem(text);
    });

    clearDoneBtn.addEventListener("click", clearDone);

    // 로그인하면 목록을 불러오고 실시간 구독을 시작한다
    async function startList() {
      const run = ++listRun;
      items = [];
      loaded = false;
      render();
      await migrateLegacyItems();
      if (run !== listRun) return;
      await loadItems();
      if (run !== listRun) return;
      subscribeChanges();
    }

    // 로그아웃하면 구독을 끊고 화면의 목록을 비운다
    function stopList() {
      listRun++;
      if (channel) {
        supabase.removeChannel(channel);
        channel = null;
      }
      items = [];
      loaded = false;
      render();
    }

    // 깃허브 사용자 이름 (아이디가 없으면 표시 이름이나 이메일로 대신한다)
    function githubName(user) {
      const m = user.user_metadata || {};
      return m.user_name || m.preferred_username || m.full_name || m.name || user.email || "깃허브 사용자";
    }

    function applySession(session) {
      const user = session?.user ?? null;
      loginView.hidden = Boolean(user);
      listView.hidden = !user;
      userBar.hidden = !user;
      loginBtn.disabled = false;
      if (user) userName.textContent = githubName(user);

      const userId = user?.id ?? null;
      if (userId === currentUserId) return; // 토큰 갱신처럼 같은 사용자면 다시 불러오지 않는다
      currentUserId = userId;
      clearError();
      if (user) startList();
      else stopList();
    }

    loginBtn.addEventListener("click", async () => {
      loginBtn.disabled = true;
      const { error } = await supabase.auth.signInWithOAuth({
        provider: "github",
        options: { redirectTo: REDIRECT_URL },
      });
      if (error) {
        loginBtn.disabled = false;
        showError("깃허브 로그인을 시작하지 못했어요.", error);
      }
    });

    logoutBtn.addEventListener("click", async () => {
      const { error } = await supabase.auth.signOut();
      if (error) showError("로그아웃하지 못했어요.", error);
    });

    // 처음 열 때(INITIAL_SESSION), 로그인·로그아웃할 때마다 화면을 바꾼다.
    // 콜백 안에서 바로 Supabase를 부르면 멈출 수 있어 다음 차례로 미룬다.
    supabase.auth.onAuthStateChange((_event, session) => {
      setTimeout(() => {
        applySession(session);
        if (!session && oauthError) showError(`깃허브 로그인에 실패했어요: ${oauthError}`);
      }, 0);
    });
  </script>
</body>
</html>
